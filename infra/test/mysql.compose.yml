name: douyin-ops-integration

services:
  mysql-test:
    image: mysql:8.0
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: douyin_ops_test
      MYSQL_USER: douyin_test
      MYSQL_PASSWORD: local-test-password
      MYSQL_ROOT_PASSWORD: local-test-root-password
    ports:
      - "127.0.0.1:33307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udouyin_test", "-plocal-test-password"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
