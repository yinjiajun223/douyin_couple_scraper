name: douyin-ops-smoke

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: mysql://douyin_smoke:smoke-password@mysql:3306/douyin_ops
  CREDENTIAL_ENCRYPTION_KEY: smoke-credential-encryption-key-32-characters
  OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
  OSS_REGION: cn-hangzhou
  OSS_BUCKET: private-smoke-bucket
  OSS_ACCESS_KEY_ID: smoke-access-key-id
  OSS_ACCESS_KEY_SECRET: smoke-access-key-secret-value
  OSS_READINESS_PROBE: "false"

services:
  mysql:
    image: mysql:8.0
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: douyin_ops
      MYSQL_PASSWORD: smoke-password
      MYSQL_ROOT_PASSWORD: smoke-root-password
      MYSQL_USER: douyin_smoke
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psmoke-root-password"]
      interval: 3s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/mysql

  migrate:
    image: douyin-ops-api:smoke
    environment: *app-environment
    command: ["node", "packages/domain/dist/database/migrate-cli.js"]
    depends_on:
      mysql:
        condition: service_healthy

  api:
    image: douyin-ops-api:smoke
    environment:
      <<: *app-environment
      API_HOST: 0.0.0.0
      API_PORT: 3000
      SESSION_SECRET: smoke-session-secret-at-least-32-characters
      COLLECTOR_MIN_VERSION: 0.1.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    image: douyin-ops-worker:smoke
    environment:
      <<: *app-environment
      WORKER_ID: smoke-worker
      WORKER_POLL_INTERVAL_MS: 2000
      WORKER_CONCURRENCY: 1
      MEDIA_RETENTION_DAYS: 180
      MEDIA_CLEANUP_BATCH_SIZE: 100
      MEDIA_CLEANUP_INTERVAL_MS: 3600000
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: douyin-ops-web:smoke
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    image: nginx:1.29-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./nginx.smoke.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
