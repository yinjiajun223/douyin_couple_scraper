name: Collector release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Collector version from apps/collector/package.json
        required: true
        default: 0.1.6
      api_base_url:
        description: Production HTTPS API base URL embedded in the packages
        required: true
        default: https://106.12.56.109
      include_macos:
        description: Also build and publish macOS after both architecture smoke tests
        type: boolean
        default: false

permissions:
  contents: write

env:
  BUILD_NODE_VERSION: 24.10.0

jobs:
  windows:
    name: Windows package and smoke test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.BUILD_NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Windows package
        shell: pwsh
        run: |
          ./scripts/build-collector-windows.ps1 `
            -Version '${{ inputs.version }}' `
            -ApiBaseUrl '${{ inputs.api_base_url }}' `
            -CaCertificatePath 'release/collector-server-ca.pem'
      - name: Smoke test Windows package
        shell: pwsh
        run: |
          ./scripts/test-collector-windows-package.ps1 `
            -PackagePath 'artifacts/collector-windows-v${{ inputs.version }}.zip'
      - name: Smoke test Windows launcher
        shell: powershell
        run: |
          ./scripts/test-collector-windows-launcher.ps1 `
            -PackagePath 'artifacts/collector-windows-v${{ inputs.version }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: collector-windows-v${{ inputs.version }}
          path: |
            artifacts/collector-windows-v${{ inputs.version }}.zip
            artifacts/collector-windows-v${{ inputs.version }}.zip.sha256
          if-no-files-found: error

  macos_intel:
    if: ${{ inputs.include_macos }}
    name: macOS universal package and Intel smoke test
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.BUILD_NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build macOS universal package
        run: |
          bash scripts/build-collector-macos.sh \
            --version '${{ inputs.version }}' \
            --architecture universal \
            --api-base-url '${{ inputs.api_base_url }}' \
            --ca-certificate 'release/collector-server-ca.pem'
      - name: Smoke test macOS package on Intel
        run: |
          bash scripts/test-collector-macos-package.sh \
            --package 'artifacts/collector-macos-universal-v${{ inputs.version }}.tar.gz'
      - uses: actions/upload-artifact@v4
        with:
          name: collector-macos-universal-v${{ inputs.version }}
          path: |
            artifacts/collector-macos-universal-v${{ inputs.version }}.tar.gz
            artifacts/collector-macos-universal-v${{ inputs.version }}.tar.gz.sha256
          if-no-files-found: error

  macos_arm64:
    if: ${{ inputs.include_macos }}
    name: macOS Apple Silicon smoke test
    needs: macos_intel
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: collector-macos-universal-v${{ inputs.version }}
          path: artifacts
      - name: Smoke test the same macOS package on Apple Silicon
        run: |
          bash scripts/test-collector-macos-package.sh \
            --package 'artifacts/collector-macos-universal-v${{ inputs.version }}.tar.gz'

  publish:
    name: Publish durable release assets
    if: ${{ always() && needs.windows.result == 'success' && (!inputs.include_macos || (needs.macos_intel.result == 'success' && needs.macos_arm64.result == 'success')) }}
    needs:
      - windows
      - macos_intel
      - macos_arm64
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      INCLUDE_MACOS: ${{ inputs.include_macos }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: collector-*
          path: release-assets
          merge-multiple: true
      - name: Upload assets and publish release
        shell: bash
        run: |
          set -euo pipefail
          tag='collector-v${{ inputs.version }}'
          cat >release-notes.md <<'EOF'
          Windows collector package with bundled Node.js and production connection settings.

          This update adds bounded recovery for transient page failures, local recovery diagnostics, and a fix for hidden verification-script false positives. Login expiry, CAPTCHA, and explicit platform restrictions still pause for manual handling. Only hard-filter-passing creators produce uploaded screenshots.

          Automated release gates:
          - Windows package build, DPAPI, persistent profile, visible Chrome, and local control page smoke test

          Verify the downloaded package against its accompanying SHA256 file before use.
          Dedicated two-hour and 24-hour real runs were waived by the operator in favor of online acceptance; this release does not claim completed 24-hour real-world validation.
          EOF
          if [ "$INCLUDE_MACOS" = 'true' ]; then
            printf '\nAlso includes the macOS universal package, smoke-tested on both Intel and Apple Silicon.\n' >>release-notes.md
          else
            printf '\nWindows-only release. No macOS package is published for this version; macOS users should keep their previously validated version.\n' >>release-notes.md
          fi
          if gh release view "$tag" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo '${{ github.repository }}'
            gh release edit "$tag" \
              --draft=false \
              --prerelease=false \
              --title "Collector v${{ inputs.version }}" \
              --notes-file release-notes.md \
              --repo '${{ github.repository }}'
          else
            gh release create "$tag" release-assets/* \
              --target '${{ github.sha }}' \
              --title "Collector v${{ inputs.version }}" \
              --notes-file release-notes.md \
              --repo '${{ github.repository }}'
          fi
